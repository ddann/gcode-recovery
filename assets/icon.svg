<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3340"/>
      <stop offset="1" stop-color="#14181e"/>
    </linearGradient>
    <linearGradient id="noz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ced6"/>
      <stop offset="0.5" stop-color="#f4f6f8"/>
      <stop offset="1" stop-color="#9aa1ab"/>
    </linearGradient>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#bg)"/>
  <!-- printed layers -->
  <g fill="#ff8c1a">
    <rect x="232" y="720" width="560" height="44" rx="10"/>
    <rect x="232" y="666" width="560" height="44" rx="10" opacity="0.92"/>
    <rect x="232" y="612" width="560" height="44" rx="10" opacity="0.84"/>
    <rect x="232" y="558" width="560" height="44" rx="10" opacity="0.76"/>
  </g>
  <!-- the layer being recovered -->
  <rect x="232" y="504" width="330" height="44" rx="10" fill="#ffb366" stroke="#fff" stroke-width="6" stroke-dasharray="18 12"/>
  <!-- nozzle -->
  <rect x="452" y="170" width="120" height="150" rx="14" fill="url(#noz)"/>
  <path d="M440 320 H584 L540 420 H484 Z" fill="url(#noz)"/>
  <rect x="496" y="420" width="32" height="34" rx="6" fill="#e9ecef"/>
  <!-- touch / force arrows -->
  <g stroke="#43d17a" stroke-width="18" stroke-linecap="round" fill="none">
    <path d="M330 300 v120"/>
    <path d="M300 390 l30 34 l30 -34"/>
    <path d="M694 300 v120"/>
    <path d="M664 390 l30 34 l30 -34"/>
  </g>
  <rect x="460" y="476" width="104" height="10" rx="5" fill="#43d17a"/>
</svg>
